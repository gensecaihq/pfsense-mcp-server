[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pfsense-mcp-server"
version = "1.0.0"
description = "MCP server for pfSense firewall management via the REST API v2"
requires-python = ">=3.11"

readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "gensecaihq" }]
keywords = ["mcp", "pfsense", "firewall", "vpn", "network", "model-context-protocol"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking :: Firewalls",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    # Capped below 4.0: fastmcp 4 (MCP spec 2026-07-28) is still in beta.
    "fastmcp>=3.4.6,<4.0",
    # Direct dependency: src/tools/* import mcp.types.ToolAnnotations.
    # mcp 2.0.0 restructured the package; stay on 1.x until fastmcp 4.
    "mcp>=1.24.0,<2.0.0",
    "python-dotenv>=1.0.0",
    # Pin aligned with requirements.txt.
    "httpx>=0.27,<1.0",
]

[project.urls]
Homepage = "https://github.com/gensecaihq/pfsense-mcp-server"
Repository = "https://github.com/gensecaihq/pfsense-mcp-server"
Issues = "https://github.com/gensecaihq/pfsense-mcp-server/issues"
Changelog = "https://github.com/gensecaihq/pfsense-mcp-server/blob/main/CHANGELOG.md"

# Console entry point so the server can be run without cloning the repo, e.g.
#   uvx pfsense-mcp-server   /   pipx install pfsense-mcp-server
# See issue #8.
[project.scripts]
pfsense-mcp-server = "src.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
