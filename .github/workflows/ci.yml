name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    env:
      PFSENSE_URL: "https://192.0.2.1"
      PFSENSE_API_KEY: "test-key"
      AUTH_METHOD: "api_key"
      VERIFY_SSL: "false"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest>=8.0" "pytest-asyncio>=0.23" "pytest-cov>=5.0" "ruff>=0.4"

      - name: Run tests with coverage
        # Coverage floor ratchets: raise it as suites are added, never lower it.
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under=40 -v

      - name: Lint with ruff
        run: ruff check src/ tests/

  # End-to-end MCP protocol conformance via the official MCP Inspector CLI:
  # real initialize handshake, tools/list on both transports, guardrail
  # confirm-gate over the wire, read-only mode, HTTP bearer-auth and Origin
  # enforcement. Catches transport/handshake regressions the in-process
  # pytest suite cannot see.
  mcp-inspector-e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run MCP Inspector smoke test
        run: PYTHON=python ./scripts/inspector_smoke.sh

  security:
    # Dependency vulnerability scan. Informational for now (continue-on-error)
    # so a freshly-disclosed advisory surfaces without blocking unrelated merges.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Audit dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt --strict --desc

  # Forward-compat probe: fastmcp 4 (MCP spec 2026-07-28, mcp SDK 2.x) is in
  # beta. This job proves the codebase already runs on it, so moving to the
  # sessionless protocol when 4.0 goes stable is only a pin change. Failures
  # signal upstream churn to investigate — they do not block merges.
  test-fastmcp-4-beta:
    runs-on: ubuntu-latest
    continue-on-error: true

    env:
      PFSENSE_URL: "https://192.0.2.1"
      PFSENSE_API_KEY: "test-key"
      AUTH_METHOD: "api_key"
      VERIFY_SSL: "false"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies (fastmcp 4 beta)
        run: |
          python -m pip install --upgrade pip
          pip install "fastmcp==4.0.0b2" python-dotenv "httpx>=0.27" "pytest>=8.0" "pytest-asyncio>=0.23" "pytest-cov>=5.0"

      - name: Run tests on fastmcp 4 beta
        run: pytest -q

      # Wire-level forward-compat: the Inspector smoke test proves the
      # stateless-era stack also negotiates and serves real MCP traffic on
      # both transports, not just that the unit suite imports cleanly.
      - name: Run MCP Inspector smoke test on fastmcp 4 beta
        run: PYTHON=python ./scripts/inspector_smoke.sh
